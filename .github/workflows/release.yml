# npm 배포. Actions 탭에서 손으로 실행한다(main에서만).
# npm 신뢰 배포(OIDC)를 쓰므로 토큰을 저장하지 않는다. npmjs.com의 gitbell → Settings → Trusted Publisher에
# GitHub Actions(kgyujin/gitbell, 워크플로 release.yml)가 등록되어 있어야 한다.
# 하는 일: 테스트 → package.json 버전이 아직 npm에 없는지 확인 → 배포(출처 증명 포함) → v<버전> 태그.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Test the Windows app
        working-directory: windows
        run: |
          npm ci
          npm test
      - name: Check the version is new
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "gitbell@$version" version >/dev/null 2>&1; then
            echo "gitbell@$version is already on npm. Bump the version first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish
        # 신뢰 배포(OIDC)만 쓴다. setup-node가 넣는 자리표시 토큰을 비워, OIDC가 실패하면 그 이유가 그대로 보이게 한다.
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish --provenance --access public --loglevel verbose
      - name: Tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
