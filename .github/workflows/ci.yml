# GitBell 테스트. 세 OS에서 같은 앱(Electron)을 확인한다.
# - 단위 테스트와 E2E(앱을 띄워 패널을 누르는 테스트)
# - 설치 파일을 만들 수 있는지(electron-builder --dir: 설치 파일 직전의 앱 폴더까지 만든다)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: E2E tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04는 비특권 사용자 이름공간을 막아 Electron(Chromium) 샌드박스가 뜨지 않는다.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: test-results
          if-no-files-found: ignore
      - name: Package (app folder only)
        run: npx electron-builder --dir --publish never

  # npx 설치기(bin/gitbell.js): 0.5.3을 npx로 설치해 둔 위에 이미 배포된 Release(0.6.0)를 설치해 보고,
  # 예전 설치본이 정리되는지, 새 앱이 실행되는지, 지우기가 되는지 확인한다.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GITBELL_LANG: en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install 0.5.3 with npx (the version people have now)
        if: runner.os != 'Linux'
        run: npx -y gitbell@0.5.3
      - name: Install the released app with the installer
        run: node -e "require('./bin/gitbell.js').install({ version: '0.6.0' })"
      - name: Check (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d ~/Applications/GitBell.app/Contents/MacOS
          plutil -extract CFBundleShortVersionString raw ~/Applications/GitBell.app/Contents/Info.plist | grep -x 0.6.0
          sleep 5 && pgrep -x GitBell
      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\GitBell'
          if (-not (Test-Path "$dir\GitBell.exe")) { throw 'GitBell.exe is missing' }
          if (Test-Path "$dir\windows") { throw 'the 0.5.x install was not removed' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GitBell') { throw 'the 0.5.x uninstall entry is still there' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'GitBell'))) { throw 'settings from 0.5.x should be kept' }
          Start-Sleep -Seconds 5
          if (-not (Get-Process -Name GitBell -ErrorAction SilentlyContinue)) { throw 'GitBell is not running' }
      - name: Check (Linux)
        if: runner.os == 'Linux'
        run: test -x ~/Applications/GitBell.AppImage && test -f ~/.local/share/applications/gitbell.desktop
      - name: Uninstall
        run: node bin/gitbell.js uninstall --purge
      - name: Check it is gone
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then ! test -e ~/Applications/GitBell.app; fi
          if [ "$RUNNER_OS" = Linux ]; then ! test -e ~/Applications/GitBell.AppImage; fi
          if [ "$RUNNER_OS" = Windows ]; then ! test -e "$LOCALAPPDATA/Programs/GitBell/GitBell.exe"; ! test -e "$APPDATA/GitBell"; fi
