# GitBell 테스트. 세 OS에서 같은 앱(Electron)을 확인한다.
# - 단위 테스트와 E2E(앱을 띄워 패널을 누르는 테스트)
# - 설치 파일을 만들 수 있는지(electron-builder --dir: 설치 파일 직전의 앱 폴더까지 만든다)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: E2E tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04는 비특권 사용자 이름공간을 막아 Electron(Chromium) 샌드박스가 뜨지 않는다.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: test-results
          if-no-files-found: ignore
      - name: Package (app folder only)
        run: npx electron-builder --dir --publish never
