<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com">
  <title>GitBell</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="main">
    <header id="header" class="header"></header>
    <div id="searchBox" class="search" hidden>
      <span class="search-icon" id="searchIcon"></span>
      <input id="searchInput" type="text" spellcheck="false" autocomplete="off">
      <button id="searchClear" class="search-clear" type="button" hidden></button>
    </div>
    <div id="body"></div>
  </div>
  <div id="settings" hidden></div>
  <div id="menu" class="menu" role="menu" hidden></div>
  <!-- 화면을 다시 그려도 사라지지 않는 알림 자리. 되돌리기·문제·복사 같은 바뀐 상태를 화면 읽기 프로그램에 알린다. -->
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <canvas id="trayCanvas" width="32" height="32" hidden></canvas>
  <script src="icons.js"></script>
  <script src="tray-icon.js"></script>
  <script src="panel.js"></script>
</body>
</html>
